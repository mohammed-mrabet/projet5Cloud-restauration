apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paiement-db-pvc
  namespace: restauration
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paiement-db
  namespace: restauration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paiement-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paiement-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: paiement-db-secret
            - configMapRef:
                name: paiement-db-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paiement-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: paiement-db
  namespace: restauration
spec:
  selector:
    app: paiement-db
  ports:
    - port: 3306
      targetPort: 3306
