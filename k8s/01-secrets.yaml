# =========================================================
# Secrets — identifiants MySQL UNIQUEMENT (exigence Phase 4 : "Utilisation
# stricte de Secrets pour les identifiants MySQL"). Le nom de la base
# (non sensible) est lui dans un ConfigMap (voir 02-configmaps.yaml).
#
# "stringData" encode automatiquement en base64 : plus pratique à relire/
# modifier qu'un champ "data" déjà encodé à la main.
# =========================================================

apiVersion: v1
kind: Secret
metadata:
  name: responsabilite-db-secret
  namespace: restauration
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_pass
  MYSQL_USER: resto_user
  MYSQL_PASSWORD: resto_pass
---
apiVersion: v1
kind: Secret
metadata:
  name: commandes-db-secret
  namespace: restauration
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_pass
  MYSQL_USER: resto_user
  MYSQL_PASSWORD: resto_pass
---
apiVersion: v1
kind: Secret
metadata:
  name: paiement-db-secret
  namespace: restauration
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_pass
  MYSQL_USER: resto_user
  MYSQL_PASSWORD: resto_pass
